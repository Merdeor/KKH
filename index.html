<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>태블릿 점검기</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2457d6">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c1f24; --muted:#667085; --line:#e4e7ec;
          --ok:#12805c; --warn:#b54708; --bad:#c0281c; --na:#667085; --pending:#475467; --accent:#2457d6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --card:#1e2127; --text:#eef0f3; --muted:#9aa3b2; --line:#2e333b;
            --ok:#4cc38a; --warn:#f0a35b; --bad:#ff7a70; --na:#9aa3b2; --pending:#b7beca; --accent:#7ea2ff; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,-apple-system,"Noto Sans KR",sans-serif;
         padding:16px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left)); }
  main { max-width:860px; margin:0 auto; }
  h1 { font-size:1.6rem; margin:8px 0 4px; }
  h2 { font-size:1.1rem; margin:28px 0 10px; }
  p.sub { color:var(--muted); margin:0 0 16px; }
  #summary { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
  #summary .verdict { font-size:1.25rem; font-weight:700; }
  #summary .counts { color:var(--muted); margin-top:4px; }
  .list { display:grid; gap:8px; }
  .item { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px;
          display:grid; grid-template-columns:auto 1fr; gap:4px 12px; align-items:baseline; }
  .badge { font-weight:700; font-size:.85rem; padding:2px 10px; border-radius:999px; border:1.5px solid currentColor; white-space:nowrap; }
  .ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)} .na{color:var(--na)} .pending{color:var(--pending)} .info{color:var(--muted)}
  .item .title { font-weight:600; }
  .item .msg { grid-column:2; color:var(--muted); font-size:.92rem; word-break:break-word; }
  .item .advice { grid-column:1 / -1; margin-top:4px; padding:8px 10px; border-radius:8px; background:var(--bg); font-size:.92rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; }
  button { font:inherit; min-height:48px; padding:8px 16px; border-radius:12px; border:1px solid var(--line);
           background:var(--card); color:var(--text); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button:disabled { opacity:.5; }
  #overlay { position:fixed; inset:0; z-index:10; background:#000; color:#fff; display:flex; flex-direction:column; }
  #overlay[hidden] { display:none; }
  .ov-body { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:24px; text-align:center; }
  .ov-body video { max-width:100%; max-height:55vh; border-radius:12px; background:#111; }
  .ov-bar { display:flex; gap:8px; padding:8px 12px; background:#111; }
  .ov-bar button { flex:1; background:#222; color:#fff; border-color:#444; }
  .tgrid { flex:1; display:grid; touch-action:none; user-select:none; -webkit-user-select:none; }
  .tgrid div { border:1px solid #333; background:#1b1b1b; }
  .tgrid div.hit { background:#12805c; }
  .color-hint { position:fixed; bottom:12px; left:0; right:0; text-align:center; font-size:.9rem; mix-blend-mode:difference; color:#fff; pointer-events:none; }
</style>
</head>
<body>
<main>
  <h1>태블릿 점검기</h1>
  <p class="sub">이 기기의 상태를 자동 검사와 직접 확인 검사로 점검합니다. 모든 검사는 기기 안에서만 처리되며 외부로 전송되지 않습니다.</p>

  <section id="summary" aria-live="polite"></section>
  <div style="margin-top:12px"><button class="primary" id="runAuto">자동 검사 다시 실행</button></div>

  <h2>자동 검사</h2>
  <div id="auto" class="list"></div>

  <h2>직접 확인 검사 (버튼을 눌러 하나씩 진행)</h2>
  <div class="grid" id="manualButtons"></div>
  <div id="manual" class="list" style="margin-top:12px"></div>

  <h2>기기 정보</h2>
  <div id="info" class="list"></div>
</main>
<div id="overlay" hidden></div>

<script src="diag.js"></script>
<script>
(function () {
  'use strict';
  var D = window.Diag;
  var $ = function (id) { return document.getElementById(id); };
  var LABEL = { ok: '정상', warn: '주의', bad: '문제', na: '미지원', pending: '미검사', info: '정보' };

  var AUTO = [
    ['battery', '배터리'], ['storage', '저장공간'], ['memory', '메모리'],
    ['network', '네트워크'], ['cpu', '처리 속도'], ['fps', '화면 프레임']
  ];
  var MANUAL = [
    ['touch', '터치 반응'], ['display', '화면 색상/불량 화소'], ['sound', '스피커'],
    ['camera', '카메라'], ['mic', '마이크'], ['sensor', '움직임 센서'], ['vibrate', '진동']
  ];
  var results = {};
  AUTO.concat(MANUAL).forEach(function (t) { results[t[0]] = { id: t[0], title: t[1], status: D.PENDING, msg: '아직 검사하지 않았습니다' }; });

  function set(id, res) { results[id].status = res.status; results[id].msg = res.msg; render(); }

  function itemEl(r) {
    var el = document.createElement('div'); el.className = 'item';
    var b = document.createElement('span'); b.className = 'badge ' + r.status; b.textContent = LABEL[r.status];
    var t = document.createElement('span'); t.className = 'title'; t.textContent = r.title;
    var m = document.createElement('span'); m.className = 'msg'; m.textContent = r.msg;
    el.append(b, t, m);
    var adv = D.adviceFor(r.id, r.status);
    if (adv) { var a = document.createElement('span'); a.className = 'advice'; a.textContent = '해결 방법: ' + adv; el.appendChild(a); }
    return el;
  }
  function render() {
    $('auto').replaceChildren.apply($('auto'), AUTO.map(function (t) { return itemEl(results[t[0]]); }));
    $('manual').replaceChildren.apply($('manual'), MANUAL.map(function (t) { return itemEl(results[t[0]]); }));
    var s = D.summarize(Object.keys(results).map(function (k) { return results[k].status; }));
    var c = s.counts, sum = $('summary'); sum.replaceChildren();
    var v = document.createElement('div'); v.className = 'verdict';
    v.textContent = s.verdict + (s.score === null ? '' : ' (점수 ' + s.score + ')');
    var n = document.createElement('div'); n.className = 'counts';
    n.textContent = '정상 ' + c.ok + ' · 주의 ' + c.warn + ' · 문제 ' + c.bad + ' · 미지원 ' + c.na + ' · 미검사 ' + c.pending;
    sum.append(v, n);
  }

  // ---------- 자동 검사 ----------
  async function checkBattery() {
    if (!navigator.getBattery) return set('battery', D.gradeBattery(null));
    try { var b = await navigator.getBattery(); set('battery', D.gradeBattery(b.level, b.charging)); }
    catch (e) { set('battery', D.gradeBattery(null)); }
  }
  async function checkStorage() {
    if (!navigator.storage || !navigator.storage.estimate) return set('storage', D.gradeStorage());
    try { var e = await navigator.storage.estimate(); set('storage', D.gradeStorage(e.usage, e.quota)); }
    catch (_) { set('storage', D.gradeStorage()); }
  }
  function checkMemory() { set('memory', D.gradeMemory(navigator.deviceMemory)); }
  function checkNetwork() {
    var c = navigator.connection || {};
    set('network', D.gradeNetwork(navigator.onLine, c.effectiveType, c.downlink, c.rtt));
  }
  function checkCpu() {
    var t = performance.now(), x = 0;
    for (var i = 0; i < 2e7; i++) x += Math.sqrt(i) % 7;
    var ms = performance.now() - t;
    set('cpu', x < 0 ? D.gradeCpu(NaN) : D.gradeCpu(ms));
  }
  function checkFps() {
    return new Promise(function (resolve) {
      var frames = 0, start = null, done = false;
      var timer = setTimeout(function () { if (!done) { done = true; set('fps', D.gradeFps(NaN)); resolve(); } }, 4000);
      function tick(ts) {
        if (done) return;
        if (start === null) start = ts;
        frames++;
        if (ts - start >= 1000) { done = true; clearTimeout(timer); set('fps', D.gradeFps(frames * 1000 / (ts - start))); resolve(); }
        else requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    });
  }
  async function runAuto() {
    var btn = $('runAuto'); btn.disabled = true; btn.textContent = '검사 중...';
    await checkBattery(); await checkStorage(); checkMemory(); checkNetwork();
    await new Promise(function (r) { setTimeout(r, 30); }); // 화면 갱신 여유
    checkCpu(); await checkFps();
    btn.disabled = false; btn.textContent = '자동 검사 다시 실행';
  }

  // ---------- 오버레이 도구 ----------
  function openOverlay() { var o = $('overlay'); o.replaceChildren(); o.hidden = false; return o; }
  function closeOverlay() { var o = $('overlay'); o.hidden = true; o.replaceChildren(); o.style.background = ''; }
  function body(text) {
    var d = document.createElement('div'); d.className = 'ov-body';
    var p = document.createElement('div'); p.style.fontSize = '1.2rem'; p.textContent = text; d.appendChild(p);
    return d;
  }
  function bar(buttons) {
    var b = document.createElement('div'); b.className = 'ov-bar';
    buttons.forEach(function (x) { var el = document.createElement('button'); el.textContent = x[0]; el.onclick = x[1]; b.appendChild(el); });
    return b;
  }
  function ask(question, extra) {
    return new Promise(function (resolve) {
      var o = openOverlay(), b = body(question);
      if (extra) b.insertBefore(extra, b.firstChild);
      o.append(b, bar([['예, 정상입니다', function () { closeOverlay(); resolve(true); }],
                       ['아니요, 이상합니다', function () { closeOverlay(); resolve(false); }]]));
    });
  }

  // ---------- 직접 확인 검사 ----------
  function touchTest() {
    return new Promise(function (resolve) {
      var land = innerWidth > innerHeight, cols = land ? 10 : 6, rows = land ? 6 : 10, total = cols * rows;
      var o = openOverlay(), g = document.createElement('div'); g.className = 'tgrid';
      g.style.gridTemplateColumns = 'repeat(' + cols + ',1fr)'; g.style.gridTemplateRows = 'repeat(' + rows + ',1fr)';
      var cells = [], hit = 0, active = {}, maxPts = 0;
      for (var i = 0; i < total; i++) { var c = document.createElement('div'); g.appendChild(c); cells.push(c); }
      function mark(e) {
        var el = document.elementFromPoint(e.clientX, e.clientY);
        if (el && el.parentNode === g && !el.classList.contains('hit')) { el.classList.add('hit'); hit++; }
      }
      g.addEventListener('pointerdown', function (e) { active[e.pointerId] = 1; maxPts = Math.max(maxPts, Object.keys(active).length); mark(e); });
      g.addEventListener('pointermove', function (e) { if (active[e.pointerId]) mark(e); });
      var end = function (e) { delete active[e.pointerId]; };
      g.addEventListener('pointerup', end); g.addEventListener('pointercancel', end);
      var info = document.createElement('div'); info.style.cssText = 'padding:6px;text-align:center;background:#111';
      info.textContent = '모든 칸이 초록색이 되도록 화면 전체를 손가락으로 문질러 주세요. 두 손가락 이상도 써 보세요.';
      o.append(info, g, bar([['검사 종료', function () { closeOverlay(); resolve(); set('touch', D.gradeTouch(hit, total, maxPts)); }]]));
    });
  }

  async function displayTest() {
    var colors = ['#ff0000', '#00ff00', '#0000ff', '#ffffff', '#000000'], i = 0;
    await new Promise(function (resolve) {
      var o = openOverlay(); o.style.background = colors[0];
      var hint = document.createElement('div'); hint.className = 'color-hint'; hint.textContent = '화면을 탭하면 다음 색으로 바뀝니다 (1/5)';
      o.appendChild(hint);
      o.onclick = function () {
        i++;
        if (i >= colors.length) { o.onclick = null; resolve(); return; }
        o.style.background = colors[i]; hint.textContent = '화면을 탭하면 다음 색으로 바뀝니다 (' + (i + 1) + '/5)';
      };
    });
    var ok = await ask('색상 화면에서 얼룩, 줄무늬, 멈춘 점(죽은 화소), 번인이 전혀 없었나요?');
    set('display', D.yesNo(ok, '모든 색상이 균일하게 표시됨', '사용자가 화면 이상(얼룩/죽은 화소 등)을 보고함'));
  }

  async function soundTest() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return set('sound', { status: D.NA, msg: '오디오를 지원하지 않습니다' });
    try {
      var ctx = new AC(), osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.frequency.value = 440; gain.gain.value = 0.3; osc.connect(gain); gain.connect(ctx.destination);
      osc.start(); setTimeout(function () { osc.stop(); ctx.close(); }, 1200);
    } catch (e) { return set('sound', { status: D.BAD, msg: '재생 실패: ' + e.name }); }
    var ok = await ask('기기 음량을 높이고 1초간 "삐" 소리가 들렸나요? (무음 모드가 꺼져 있어야 합니다)');
    set('sound', D.yesNo(ok, '스피커 소리 정상', '소리가 들리지 않음 - 스피커/음량/무음 설정 확인 필요'));
  }

  async function cameraTest() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return set('camera', { status: D.NA, msg: '카메라 API를 지원하지 않습니다 (HTTPS 또는 localhost 필요)' });
    var stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ video: true }); }
    catch (e) { return set('camera', { status: e.name === 'NotAllowedError' ? D.WARN : D.BAD, msg: e.name === 'NotAllowedError' ? '권한이 거부되었습니다 (브라우저 설정에서 허용 후 재시도)' : '카메라를 열 수 없음: ' + e.name }); }
    var v = document.createElement('video'); v.autoplay = true; v.muted = true; v.playsInline = true; v.srcObject = stream;
    var ok = await ask('카메라 화면이 선명하게 보이나요?', v);
    stream.getTracks().forEach(function (t) { t.stop(); });
    set('camera', D.yesNo(ok, '카메라 영상 정상', '카메라 영상에 문제가 있다고 보고됨'));
  }

  async function micTest() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !AC) return set('mic', { status: D.NA, msg: '마이크 API를 지원하지 않습니다 (HTTPS 또는 localhost 필요)' });
    var stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch (e) { return set('mic', { status: e.name === 'NotAllowedError' ? D.WARN : D.BAD, msg: e.name === 'NotAllowedError' ? '권한이 거부되었습니다 (브라우저 설정에서 허용 후 재시도)' : '마이크를 열 수 없음: ' + e.name }); }
    var o = openOverlay(); o.appendChild(body('3초 동안 마이크에 대고 말씀하거나 손뼉을 쳐 주세요...'));
    var ctx = new AC(), an = ctx.createAnalyser(); an.fftSize = 1024;
    ctx.createMediaStreamSource(stream).connect(an);
    var buf = new Float32Array(an.fftSize), peak = 0, t0 = performance.now();
    await new Promise(function (resolve) {
      (function loop() {
        an.getFloatTimeDomainData(buf);
        for (var i = 0; i < buf.length; i++) peak = Math.max(peak, Math.abs(buf[i]));
        if (performance.now() - t0 < 3000) setTimeout(loop, 30); else resolve();
      })();
    });
    stream.getTracks().forEach(function (t) { t.stop(); }); ctx.close(); closeOverlay();
    set('mic', D.gradeMic(peak));
  }

  async function sensorTest() {
    if (typeof DeviceMotionEvent === 'undefined') return set('sensor', { status: D.NA, msg: '움직임 센서를 지원하지 않습니다 (데스크톱 브라우저 등)' });
    if (typeof DeviceMotionEvent.requestPermission === 'function') {
      try { if ((await DeviceMotionEvent.requestPermission()) !== 'granted') return set('sensor', { status: D.WARN, msg: '센서 권한이 거부되었습니다' }); }
      catch (e) { return set('sensor', { status: D.WARN, msg: '센서 권한 요청 실패: ' + e.name }); }
    }
    var o = openOverlay(); o.appendChild(body('3초 동안 태블릿을 천천히 기울이거나 흔들어 주세요...'));
    var n = 0, vals = false;
    function h(e) { n++; var a = e.accelerationIncludingGravity; if (a && (a.x !== null || a.y !== null || a.z !== null)) vals = true; }
    window.addEventListener('devicemotion', h);
    await new Promise(function (r) { setTimeout(r, 3000); });
    window.removeEventListener('devicemotion', h); closeOverlay();
    set('sensor', D.gradeSensor(n, vals));
  }

  async function vibrateTest() {
    if (!navigator.vibrate) return set('vibrate', { status: D.NA, msg: '이 브라우저/기기는 진동 API를 지원하지 않습니다 (iPad 등)' });
    navigator.vibrate([300, 150, 300]);
    var ok = await ask('진동이 느껴졌나요? (진동 모드/설정이 꺼져 있으면 느껴지지 않을 수 있습니다)');
    set('vibrate', D.yesNo(ok, '진동 정상', '진동이 느껴지지 않음'));
  }

  var TESTS = { touch: touchTest, display: displayTest, sound: soundTest, camera: cameraTest, mic: micTest, sensor: sensorTest, vibrate: vibrateTest };
  MANUAL.forEach(function (t) {
    var b = document.createElement('button'); b.textContent = t[1] + ' 검사';
    b.onclick = async function () { b.disabled = true; try { await TESTS[t[0]](); } catch (e) { closeOverlay(); set(t[0], { status: D.BAD, msg: '검사 중 오류: ' + (e && e.name) }); } b.disabled = false; };
    $('manualButtons').appendChild(b);
  });

  // ---------- 기기 정보 ----------
  var info = [
    ['화면', screen.width + '×' + screen.height + ' (배율 ' + devicePixelRatio + 'x)'],
    ['CPU 코어', String(navigator.hardwareConcurrency || '알 수 없음')],
    ['최대 터치 지점', String(navigator.maxTouchPoints || 0)],
    ['언어', navigator.language],
    ['브라우저', navigator.userAgent]
  ];
  var infoEl = $('info');
  info.forEach(function (x) { infoEl.appendChild(itemEl({ title: x[0], status: 'info', msg: x[1] })); });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});

  $('runAuto').onclick = runAuto;
  render();
  runAuto();
})();
</script>
</body>
</html>
